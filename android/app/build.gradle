plugins {
    id "com.android.application"
}

// CI passes VERSION_CODE (the workflow run number); local builds default to 1.
def versionCodeEnv = (System.getenv("VERSION_CODE") ?: "1").toInteger()

// Release signing comes only from environment variables (GitHub secrets in CI).
// Without them the release APK is built unsigned.
def storeFileEnv = System.getenv("SIGNING_STORE_FILE")
def hasSigning = storeFileEnv && System.getenv("SIGNING_STORE_PASSWORD") &&
        System.getenv("SIGNING_KEY_ALIAS") && System.getenv("SIGNING_KEY_PASSWORD")

android {
    namespace "io.github.kiamchomihash.mapapython"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.kiamchomihash.mapapython"
        minSdk 24
        targetSdk 35
        versionCode versionCodeEnv
        versionName "1.0.${versionCodeEnv}"
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(storeFileEnv)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
